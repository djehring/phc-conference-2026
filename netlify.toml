[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Removed redirect from /conference to / to fix SEO issues
# If /conference page needs to exist, create a proper page instead

# ---------------------------------------------------------------
# 2026 archive: the 2026 conference pages moved under /2026/ when
# the site switched to the 2027 conference. Permanent redirects keep
# every old URL (and its search ranking) working. Hash fragments such
# as /schedule/#session-id are kept by the browser.
# Netlify matches with or without a trailing slash; both are listed
# for clarity. These rules must stay above the 404 catch-all.
# ---------------------------------------------------------------
[[redirects]]
  from = "/schedule"
  to = "/2026/schedule/"
  status = 301

[[redirects]]
  from = "/schedule/"
  to = "/2026/schedule/"
  status = 301

[[redirects]]
  from = "/dinner"
  to = "/2026/dinner/"
  status = 301

[[redirects]]
  from = "/dinner/"
  to = "/2026/dinner/"
  status = 301

[[redirects]]
  from = "/exhibitors"
  to = "/2026/exhibitors/"
  status = 301

[[redirects]]
  from = "/exhibitors/"
  to = "/2026/exhibitors/"
  status = 301

[[redirects]]
  from = "/speakers"
  to = "/2026/#speakers"
  status = 301

[[redirects]]
  from = "/speakers/"
  to = "/2026/#speakers"
  status = 301

# /speakers/<slug> and /speakers/<slug>/ -> /2026/speakers/<slug>/
[[redirects]]
  from = "/speakers/:slug"
  to = "/2026/speakers/:slug/"
  status = 301

[[redirects]]
  from = "/speakers/:slug/"
  to = "/2026/speakers/:slug/"
  status = 301

# ---------------------------------------------------------------
# Short link for the delegate hotel rate, for emails and social posts.
# Keep "to" in step with ACCOMMODATION.bookingUrl in src/lib/conference.ts.
# 302 (not 301) so browsers don't cache it if the hotel link changes.
# ---------------------------------------------------------------
[[redirects]]
  from = "/hotel"
  to = "https://www.ihg.com/redirect?path=hd&brandCode=EX&localeCode=en&regionCode=925&hotelCode=WARUK&_PMID=99502056&corpNum=100276187&cn=no&adjustMonth=false&showApp=true&monthIndex=00"
  status = 302
  force = true

[[redirects]]
  from = "/hotel/"
  to = "https://www.ihg.com/redirect?path=hd&brandCode=EX&localeCode=en&regionCode=925&hotelCode=WARUK&_PMID=99502056&corpNum=100276187&cn=no&adjustMonth=false&showApp=true&monthIndex=00"
  status = 302
  force = true

# Custom 404 page (must stay last)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
