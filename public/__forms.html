<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Netlify Forms detection skeleton. Must match TicketAlertForm.tsx. Not linked from the site. -->
    <form name="ticket-alerts" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ticket-alerts" />
      <input name="bot-field" />
      <input name="first-name" type="text" />
      <input name="email" type="email" />
      <input name="consent" type="checkbox" value="yes" />
    </form>
  </body>
</html>
